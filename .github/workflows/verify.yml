name: Verify DAS replay
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-das.lock
      - name: Install pinned author-model environment
        run: python -m pip install -r requirements-das.lock
      - name: Test with concise failure diagnostics
        run: |
          if npm test > "$RUNNER_TEMP/off-ball-tests.log" 2>&1; then
            cat "$RUNNER_TEMP/off-ball-tests.log"
          else
            awk '/^not ok/ { remaining=20 } remaining { print; remaining-- } /^# (tests|pass|fail)/ { print }' "$RUNNER_TEMP/off-ball-tests.log"
            exit 1
          fi
      - run: npm run validate
      - run: npm run test:analytics
      - name: Verify author-model adaptation and sensitivity
        run: npm run benchmark
      - run: node --check app.mjs && node --check src/analysis-worker.mjs
